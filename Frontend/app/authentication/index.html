<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Jailmeet Signin/Signup</title>
	<link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css'>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Raleway:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="./style.css">
</head>

<body>

	<div class="container" id="container">
		<div class="form-container sign-up-container">
			<form action="#">
				<h1>Create JailMeet Account</h1>
				<div class="social-container">
					<a href="https://www.facebook.com/" class="social"><i class="fab fa-facebook-f"></i></a>
					<a href="https://myaccount.google.com/" class="social"><i class="fab fa-google-plus-g"></i></a>
					<a href=">https://www.linkedin.com/" class="social"><i class="fab fa-linkedin-in"></i></a>
				</div>
				<span>or use your email for registration</span>
				<input type="text" placeholder="Full Name" />
				<input type="email" placeholder="Email" />
				<input type="tel" placeholder="Phone Number" inputmode="tel" pattern="[0-9]*" />
				<input type="password" placeholder="Password" />
				<select id="state" name="state">
					<option value="" disabled selected>Select District</option>
					<option value="Thiruvananthapuram">Thiruvananthapuram</option>
					<option value="Kollam">Kollam</option>
					<option value="Pathanamthitta">Pathanamthitta</option>
					<option value="Alappuzha">Alappuzha</option>
					<option value="Kottayam">Kottayam</option>
					<option value="Idukki">Idukki</option>
					<option value="Ernakulam">Ernakulam</option>
					<option value="Thrissur">Thrissur</option>
					<option value="Palakkad">Palakkad</option>
					<option value="Malappuram">Malappuram</option>
					<option value="Kozhikode">Kozhikode</option>
					<option value="Wayanad">Wayanad</option>
					<option value="Kannur">Kannur</option>
					<option value="Kasaragod">Kasaragod</option>
				</select>
				<button>
					<span class="btn-hover-text">
						<span class="btn-hover-text-original">Register</span>
						<span class="btn-hover-text-copy" aria-hidden="true">Register</span>
					</span>
				</button>
			</form>
		</div>
		<div class="form-container sign-in-container">
			<button class="ghost" id="goBack">
				<i class="fas fa-chevron-left go-back-icon" aria-hidden="true"></i>
				<span class="btn-hover-text">
					<span class="btn-hover-text-original">GO Back</span>
					<span class="btn-hover-text-copy" aria-hidden="true">GO Back</span>
				</span>
			</button>
			<form action="#">
				<h1>Sign in JailMeet</h1>
				<div class="social-container">
					<a href="https://www.facebook.com/" class="social"><i class="fab fa-facebook-f"></i></a>
					<a href="https://myaccount.google.com/" class="social"><i class="fab fa-google-plus-g"></i></a>
					<a href=">https://www.linkedin.com/" class="social"><i class="fab fa-linkedin-in"></i></a>
				</div>
				<span>or use your email & password</span>
				<input type="email" placeholder="Email" />
				<input type="password" placeholder="Password" />
				<button>
					<span class="btn-hover-text">
						<span class="btn-hover-text-original">Login</span>
						<span class="btn-hover-text-copy" aria-hidden="true">Login</span>
					</span>
				</button>
			</form>
		</div>
		<div class="overlay-container">
			<div class="overlay">
				<div class="overlay-panel overlay-left">
					<button class="ghost" id="goBackRegister" aria-label="Go back to Sign In">
						<i class="fas fa-chevron-left go-back-icon" aria-hidden="true"></i>
						<span class="btn-hover-text">
							<span class="btn-hover-text-original">GO Back</span>
							<span class="btn-hover-text-copy" aria-hidden="true">GO Back</span>
						</span>
					</button>
					<img src="/legacy/logos/logo.png" alt="JailMeet logo" class="overlay-logo" />
					<h1>Welcome Back to JailMeet !</h1>
					<p>login to manage appointments and stay connected with your loved ones.</p>
					<button class="ghost" id="signIn">
						<span class="btn-hover-text">
							<span class="btn-hover-text-original">Login</span>
							<span class="btn-hover-text-copy" aria-hidden="true">Login</span>
						</span>
					</button>

				</div>
				<div class="overlay-panel overlay-right">
					<img src="/legacy/logos/logo.png" alt="JailMeet logo" class="overlay-logo" />
					<h1>Welcome to JailMeet !</h1>
					<p>create your account and stay connected with your loved ones.</p>
					<button class="ghost" id="signUp">
					<span class="btn-hover-text">
						<span class="btn-hover-text-original">Register</span>
						<span class="btn-hover-text-copy" aria-hidden="true">Register</span>
					</span>
				</button>
				</div>
			</div>
		</div>
	</div>

	<script src="./script.js"></script>

</body>
</html>
